[workspace]
members = ["crates/omw-app", "crates/omw-document", "crates/omw-local", "crates/omw-pi", "crates/omw-preview-worker"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
gpui-kit = "=0.7.0"
blake3 = "=1.8.2"
notify = "=7.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
]}
ignore = "=0.4.33"
comrak = { version = "=0.55.0", default-features = false }
ropey = "=1.6.1"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tokio = { version = "=1.40.0", features = ["rt-multi-thread", "process", "sync", "time", "io-util", "macros"] }
