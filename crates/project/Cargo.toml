[package]
name = "project"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false
description = "Filesystem, indexing, Pi protocol, and preview process adapters for ohMyWork."

[lib]
name = "project"
path = "src/lib.rs"

[[bin]]
name = "omw-preview-worker"
path = "src/bin/preview_worker/main.rs"

[dependencies]
blake3.workspace = true
ignore.workspace = true
notify.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "sync", "time", "io-util"] }
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3"
