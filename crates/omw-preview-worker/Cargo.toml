[package]
name = "omw-preview-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omw-preview-worker"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "sync", "time", "io-util"] }
image = "0.25"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }

# Worker is independent decode process. Binary protocol only. No GPUI dep.
# pdfium loaded from absolute path next to exe at runtime. If unavailable: clear Error("pdfium unavailable"), process stays alive.
# image used only for png/jpeg/webp/gif (first frame) decode + target size.

[dev-dependencies]
tempfile = "3"
